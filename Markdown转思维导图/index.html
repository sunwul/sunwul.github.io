<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Markdown思维导图转换器 | 简约Material</title>
  <!-- 引入 jsMind 核心样式与脚本 -->
  <link rel="stylesheet" href="./jsmind0.9.1.css">
  <script src="./jsmind0.9.1.js"></script>
  <!-- 引入 shadcn 风格灵感：基于 Tailwind 或自定义简约卡片风格，这里使用内联简约设计，模拟 Material 卡片 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f4f7fc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* 主布局：卡片容器，左右分栏 */
    .app-container {
      display: flex;
      width: 100%;
      max-width: 1440px;
      height: 90vh;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 35px rgba(0, 20, 50, 0.08), 0 8px 18px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      backdrop-filter: blur(2px);
      transition: all 0.2s ease;
    }

    /* 左侧配置面板 - 320px 固定宽度，卡片式 */
    .config-panel {
      width: 320px;
      background: #ffffff;
      border-right: 1px solid #e9eef3;
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      gap: 28px;
      overflow-y: auto;
      box-shadow: 2px 0 12px rgba(0,0,0,0.02);
      flex-shrink: 0;
    }

    .panel-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-header h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #0b2b4f;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-header .subtitle {
      font-size: 0.85rem;
      color: #5e6f82;
      font-weight: 400;
    }

    .card {
      background: #f8faff;
      border-radius: 18px;
      padding: 18px 16px;
      border: 1px solid #eef2f8;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      transition: box-shadow 0.2s;
    }

    .card:hover {
      box-shadow: 0 8px 18px rgba(33, 103, 210, 0.08);
      border-color: #d0daea;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #1e3b5c;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .upload-area {
      border: 2px dashed #bdd3f0;
      border-radius: 14px;
      padding: 22px 12px;
      text-align: center;
      background: #ffffff;
      transition: all 0.2s;
      cursor: pointer;
      color: #2c4b6b;
    }

    .upload-area:hover {
      border-color: #1e6ef0;
      background: #f0f6ff;
    }

    .upload-area.drag-over {
      border-color: #0a58ca;
      background: #e6f0ff;
    }

    .upload-icon {
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .file-name {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #0b3b6b;
      background: #e3edfc;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-block;
      word-break: break-all;
    }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .config-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #1f344d;
    }

    select, input[type="number"] {
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #dce3ec;
      background: white;
      font-size: 0.85rem;
      color: #0b1e2f;
      outline: none;
      transition: 0.15s;
      width: 130px;
    }

    select:focus, input:focus {
      border-color: #1e6ef0;
      box-shadow: 0 0 0 3px rgba(30,110,240,0.15);
    }

    .btn {
      background: #1e6ef0;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 10px 18px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #1e6ef0, #0f53c0);
      box-shadow: 0 6px 14px rgba(30,110,240,0.25);
    }

    .btn:hover {
      background: linear-gradient(135deg, #256ff5, #0b45b0);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #cfddee;
      color: #1e3b5c;
      box-shadow: none;
      background: white;
    }

    .btn-outline:hover {
      background: #f4f8ff;
      border-color: #1e6ef0;
    }

    .reset-btn {
      margin-top: 6px;
    }

    /* 右侧思维导图容器 */
    .mindmap-container {
      flex: 1;
      background: #fafbfd;
      position: relative;
      height: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    #jsmind_container {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #8a9bb5;
      gap: 12px;
    }

    .toast-message {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: white;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none;
    }

    @media (max-width: 750px) {
      .app-container {
        flex-direction: column;
        height: 95vh;
      }
      .config-panel {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e9eef3;
        max-height: 45%;
        padding: 16px;
      }
      .mindmap-container {
        height: 55%;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- 左侧配置面板 320px -->
  <div class="config-panel">
    <div class="panel-header">
      <h2>
        <span>🧠</span> 思维导图
      </h2>
      <div class="subtitle">Markdown → 可视化导图</div>
    </div>

    <!-- 文件导入卡片 -->
    <div class="card">
      <div class="card-title">📂 文件导入</div>
      <div id="dropZone" class="upload-area">
        <div class="upload-icon">📄</div>
        <div style="font-weight:500;">拖拽或点击上传</div>
        <div style="font-size:0.7rem; color:#6b7d95;">支持 .md / .markdown</div>
        <input type="file" id="fileInput" accept=".md,.markdown" hidden>
        <div id="fileNameDisplay" class="file-name" style="display:none;"></div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button id="demoBtn" class="btn-outline" style="flex:1; padding:8px;">📋 加载示例</button>
      </div>
    </div>

    <!-- 配置卡片 -->
    <div class="card">
      <div class="card-title">⚙️ 导图配置</div>
      <div class="config-group">
        <div class="config-row">
          <span class="config-label">主题</span>
          <select id="themeSelect">
            <option value="primary">蓝白经典</option>
            <option value="warning">暖橙</option>
            <option value="success">翠绿</option>
            <option value="danger">绯红</option>
          </select>
        </div>
        <div class="config-row">
          <span class="config-label">布局</span>
          <select id="layoutSelect">
            <option value="tree">树状图(左右)</option>
            <option value="right">右侧分布</option>
            <option value="left">左侧分布</option>
          </select>
        </div>
        <div class="config-row">
          <span class="config-label">展开层级</span>
          <input type="number" id="expandLevel" value="3" min="1" max="6" step="1">
        </div>
      </div>
      <button id="applyConfigBtn" class="btn" style="width:100%; margin-top:14px;">
        <span>✨</span> 应用配置
      </button>
      <button id="resetDefaultBtn" class="btn-outline reset-btn" style="width:100%; margin-top:8px;">
        恢复默认
      </button>
    </div>
    <div style="margin-top: auto; font-size:0.7rem; color:#8b9bb5; text-align:center;">
      基于 jsMind · 实时渲染
    </div>
  </div>

  <!-- 右侧思维导图容器 -->
  <div class="mindmap-container" id="mindmapWrapper">
    <div id="jsmind_container"></div>
    <div id="emptyPlaceholder" class="empty-state">
      <span style="font-size:2.5rem;">🗺️</span>
      <span>导入 Markdown 文件以生成思维导图</span>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- 全局变量 ----------
    let jmInstance = null;
    let currentMindData = null;      // 存储当前 jsMind 节点数据
    let currentFileName = '';

    // DOM 元素
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const demoBtn = document.getElementById('demoBtn');
    const themeSelect = document.getElementById('themeSelect');
    const layoutSelect = document.getElementById('layoutSelect');
    const expandLevelInput = document.getElementById('expandLevel');
    const applyConfigBtn = document.getElementById('applyConfigBtn');
    const resetDefaultBtn = document.getElementById('resetDefaultBtn');
    const mindmapContainer = document.getElementById('jsmind_container');
    const emptyPlaceholder = document.getElementById('emptyPlaceholder');

    // ---------- 工具函数：Markdown 解析为 jsMind 节点格式 ----------
    function parseMarkdownToMind(mdText) {
      const lines = mdText.split(/\r?\n/);
      const rootNode = {
        id: 'root',
        topic: '思维导图',
        children: []
      };
      
      const stack = [{ level: 0, node: rootNode }];
      let lastNode = rootNode;

      for (let line of lines) {
        // 匹配标题行 (# 开头)
        const match = line.match(/^(#{1,6})\s+(.*)/);
        if (!match) continue;
        
        const level = match[1].length;   // 标题层级 1~6
        const text = match[2].trim();
        if (!text) continue;
        
        // 生成唯一ID
        const nodeId = 'node_' + Math.random().toString(36).substr(2, 8) + Date.now();
        const newNode = {
          id: nodeId,
          topic: text,
          children: []
        };

        // 根据层级寻找父节点
        while (stack.length > 0 && stack[stack.length-1].level >= level) {
          stack.pop();
        }
        
        if (stack.length === 0) {
          // 异常情况，直接挂在根节点下
          rootNode.children.push(newNode);
          stack.push({ level: level, node: newNode });
        } else {
          const parent = stack[stack.length-1].node;
          if (!parent.children) parent.children = [];
          parent.children.push(newNode);
          stack.push({ level: level, node: newNode });
        }
      }
      
      // 如果根节点没有子节点，添加一个提示节点
      if (rootNode.children.length === 0) {
        rootNode.children.push({
          id: 'empty_tip',
          topic: '（无标题内容）',
          children: []
        });
      } else {
        // 更新根节点主题为第一个一级标题或文件名
        if (rootNode.children.length > 0) {
          rootNode.topic = rootNode.children.topic || '思维导图';
        }
      }
      
      return {
        meta: {
          name: 'markdown_mindmap',
          author: 'converter',
          version: '1.0'
        },
        format: 'node_tree',
        data: rootNode
      };
    }

    // ---------- 初始化或更新 jsMind 实例 ----------
    function renderMind(mindData) {
      if (!mindData || !mindData.data) {
        showToast('⚠️ 无效的导图数据');
        return;
      }

      // 销毁旧实例
      if (jmInstance) {
        try {
          jmInstance.destroy();
        } catch (e) {}
        jmInstance = null;
      }

      try {
        // 清空容器并隐藏占位符
        mindmapContainer.innerHTML = '';
        emptyPlaceholder.style.display = 'none';
        
        const options = {
          container: 'jsmind_container',
          theme: themeSelect.value || 'primary',
          editable: false,
          view: {
            hmargin: 80,
            vmargin: 50,
            line_width: 2,
            line_color: '#b0c7e0'
          },
          layout: layoutSelect.value || 'tree',
        };
        
        jmInstance = new jsMind(options);
        jmInstance.show(mindData);
        
        // 应用展开层级
        const expandLevel = parseInt(expandLevelInput.value, 10);
        if (!isNaN(expandLevel) && expandLevel > 0) {
          jmInstance.expand_to_depth(expandLevel);
        }
        
        currentMindData = mindData;
        showToast('✅ 思维导图已生成');
      } catch (error) {
        console.error('渲染错误:', error);
        showToast('❌ 渲染失败，请检查数据格式');
        emptyPlaceholder.style.display = 'flex';
      }
    }

    // 处理文件内容
    function processFileContent(content, fileName) {
      if (!content.trim()) {
        showToast('📭 文件内容为空');
        return;
      }
      try {
        const mindData = parseMarkdownToMind(content);
        currentFileName = fileName || 'markdown';
        // 更新根节点主题为文件名（更友好）
        if (mindData.data && mindData.data.topic === '思维导图' && fileName) {
          mindData.data.topic = fileName.replace(/\.(md|markdown)$/i, '');
        }
        renderMind(mindData);
        if (fileName) {
          fileNameDisplay.textContent = fileName;
          fileNameDisplay.style.display = 'inline-block';
        }
      } catch (e) {
        showToast('❌ Markdown解析错误');
      }
    }

    // 读取上传文件
    function handleFile(file) {
      if (!file) return;
	  console.log("已上传文件:" + file.name);
      if (!file.name.match(/\.(md|markdown)$/i)) {
        showToast('⚠️ 请上传 .md 或 .markdown 文件');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        processFileContent(content, file.name);
      };
      reader.onerror = () => showToast('❌ 文件读取失败');
      reader.readAsText(file);
    }

    // ---------- 事件绑定 ----------
    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
      fileInput.value = ''; // 允许重复上传同一文件
    });

    // 拖拽上传
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    // 演示示例
    demoBtn.addEventListener('click', () => {
      const demoMarkdown = `# 项目规划
## 前端开发
### React 组件
### 状态管理
## 后端服务
### API 设计
### 数据库
## 部署运维
### CI/CD
### 监控`;
      processFileContent(demoMarkdown, '示例导图.md');
    });

    // 应用配置按钮
    applyConfigBtn.addEventListener('click', () => {
      if (!currentMindData) {
        showToast('📌 请先导入Markdown文件');
        return;
      }
      // 重新渲染以应用主题/布局/层级
      renderMind(currentMindData);
    });

    // 重置默认配置
    resetDefaultBtn.addEventListener('click', () => {
      themeSelect.value = 'primary';
      layoutSelect.value = 'tree';
      expandLevelInput.value = 3;
      if (currentMindData) {
        renderMind(currentMindData);
      } else {
        showToast('🔄 配置已重置');
      }
    });

    // 轻提示
    function showToast(text) {
      const existing = document.querySelector('.toast-message');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast-message';
      toast.textContent = text;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2800);
    }

    // 初始加载一个友好提示（不自动加载示例，保持空白状态）
    // 但可以默认显示占位符
    emptyPlaceholder.style.display = 'flex';
    
    // 移动端触摸优化
    console.log('Markdown思维导图转换器已启动');
  })();
</script>
</body>
